[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-cms-manager"
version = "0.1.0"
description = "Multi-CMS Manager Desktop Application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.4.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.11.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=23.1.0",
    "keyring>=24.0.0",
    "tenacity>=8.2.0",
    "pybreaker>=1.0.0",
    "cryptography>=41.0.0",
    "requests>=2.31.0",
    "paramiko>=3.0.0",
    "pandas>=2.0.0",
    "odfpy>=1.4.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "responses>=0.23.0",
    "ruff>=0.1.0",
    "openpyxl>=3.1.0"
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "COM", "PT"]
ignore = ["E501", "E712"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    "."
]
